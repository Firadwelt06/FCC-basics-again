<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #6e7681;
    --accent: #58a6ff;
    --alkali: #f85149;
    --alkaline: #ffa657;
    --transition: #d2a8ff;
    --post: #79c0ff;
    --metalloid: #56d364;
    --nonmetal: #3fb950;
    --halogen: #ff7b72;
    --noble: #a5d6ff;
    --lanthanide: #ffa198;
    --actinide: #ffb77c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    overflow-x: auto;
  }
  header {
    padding: 18px 24px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .search-box {
    flex: 1;
    min-width: 160px;
    max-width: 260px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .filter-wrap {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid transparent;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: opacity 0.15s;
    opacity: 0.75;
  }
  .filter-btn.active { opacity: 1; border-color: rgba(255,255,255,0.3); }
  .filter-btn:hover { opacity: 1; }

  .main { padding: 12px 16px; }
  .table-wrap { overflow-x: auto; }
  
  .main { padding: 12px 16px; }
  .table-wrap { overflow-x: auto; }
  
  /* Desktop Layout: Scales perfectly to fit the window screen without vertical overflow */
  .pt-grid {
    display: grid;
    grid-template-columns: repeat(18, 5.3vmin);
    grid-template-rows: repeat(10, 6.8vmin);
    gap: 0.4vmin;
    width: max-content;
    margin: 0 auto;
  }
  .cell {
    width: 5.3vmin;
    height: 6.8vmin;
    border-radius: 0.5vmin;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.1s, opacity 0.15s;
    position: relative;
    padding: 0.4vmin;
  }
  .cell:hover { transform: scale(1.15); border-color: rgba(255,255,255,0.5); z-index: 10; }
  .cell.dimmed { opacity: 0.15; }
  .cell.highlighted { outline: 2px solid #fff; outline-offset: 1px; }
  .cell .num { font-size: 1.1vmin; color: rgba(255,255,255,0.5); line-height: 1; margin-bottom: 0.2vmin; }
  .cell .sym { font-size: 2.3vmin; font-weight: 700; line-height: 1.1; }
  .cell .name { font-size: 0.85vmin; color: rgba(255,255,255,0.65); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin-top: 0.2vmin; }
  .cell .mass { font-size: 0.85vmin; color: rgba(255,255,255,0.45); margin-top: 0.1vmin; }

  .placeholder { width: 5.3vmin; height: 6.8vmin; }

  .series-label {
    width: 5.3vmin; height: 6.8vmin;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95vmin; color: var(--text3); text-align: center; line-height: 1.3;
  }

  /* Category colors */
  .alkali-metal       { background: #3d1a1a; color: #ffb3ae; }
  .alkaline-earth     { background: #3d2a10; color: #ffc87a; }
  .transition-metal   { background: #2a1f3d; color: #d2a8ff; }
  .post-transition    { background: #1a2a3d; color: #79c0ff; }
  .metalloid          { background: #1a3d2a; color: #7ee787; }
  .nonmetal           { background: #163324; color: #56d364; }
  .halogen            { background: #3d1f1a; color: #ff9492; }
  .noble-gas          { background: #1a2d3d; color: #a5d6ff; }
  .lanthanide         { background: #3d1f1f; color: #ffadad; }
  .actinide           { background: #3d2b1a; color: #ffbf7a; }

  /* Panel */
  .panel-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .panel-overlay.open { opacity: 1; pointer-events: all; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 540px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px;
    transform: translateY(20px);
    transition: transform 0.2s;
  }
  .panel-overlay.open .panel { transform: translateY(0); }
  .panel-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 20px;
  }
  .big-sym {
    width: 80px; height: 80px;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .big-sym .s { font-size: 36px; font-weight: 700; line-height: 1; }
  .big-sym .n { font-size: 13px; opacity: 0.7; }
  .panel-title h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .panel-title .cat { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
  .panel-title .z { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .close-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    flex-shrink: 0;
  }
  .close-btn:hover { color: var(--text); border-color: var(--text2); }

  .section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text3);
    margin-bottom: 8px;
    margin-top: 18px;
  }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 6px;
  }
  .info-card {
    background: var(--surface2);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .info-card .label { font-size: 10px; color: var(--text3); margin-bottom: 3px; }
  .info-card .value { font-size: 14px; font-weight: 600; }
  .chips {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
  }
  .chip.ox { color: #79c0ff; border-color: #1f4070; background: #0d2340; }
  .chip.isotope { color: #7ee787; border-color: #1a4d2a; background: #0d2819; }
  .chip.stable { color: #7ee787; }
  .chip.unstable { color: #ffa657; }

  .ox-detail { margin-top: 4px; font-size: 12px; color: var(--text2); line-height: 1.6; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; color: var(--text2);
  }
  .legend-swatch {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .electron-config {
    font-size: 12px;
    color: var(--text2);
    background: var(--surface2);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Courier New', monospace;
    word-break: break-all;
  }
</style>
</head>
<body>

<header>
  <h1>⚛ Periodic Table</h1>
  <input class="search-box" id="search" placeholder="Search element, symbol, number…" autocomplete="off"/>
  <div class="filter-wrap" id="filters"></div>
</header>

<div class="legend" id="legend"></div>

<div class="main">
  <div class="table-wrap">
    <div class="pt-grid" id="grid"></div>
  </div>
</div>

<div class="panel-overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="panel" id="panel">
    <div class="panel-header">
      <div class="big-sym" id="pd-sym"></div>
      <div class="panel-title">
        <h2 id="pd-name"></h2>
        <div class="cat" id="pd-cat"></div>
        <div class="z" id="pd-z"></div>
      </div>
      <button class="close-btn" onclick="closePanel()">✕ Close</button>
    </div>

    <div class="section-title">Basic properties</div>
    <div class="info-grid" id="pd-basic"></div>

    <div class="section-title">Electron configuration</div>
    <div class="electron-config" id="pd-econf"></div>

    <div class="section-title">Oxidation states</div>
    <div class="chips" id="pd-ox"></div>
    <div class="ox-detail" id="pd-ox-detail"></div>

    <div class="section-title">Valency</div>
    <div class="chips" id="pd-val"></div>

    <div class="section-title">Notable isotopes</div>
    <div class="chips" id="pd-iso"></div>
  </div>
</div>

// Build element map by Z
const byZ = {};
E.forEach(el => {
  const [Z,sym,name,mass,cat,grp,per,ox,val,iso,econf,oxNote] = el;
  byZ[Z] = {Z,sym,name,mass,cat,grp,per,ox,val,iso,econf,oxNote};
});

// Grid position: [Z, col, row] (1-indexed)
function getPos(el) {
  const {Z,grp,per,cat} = el;
  if (grp && per && cat !== 'lanthanide' && cat !== 'actinide') {
    return [grp, per];
  }
  if (cat === 'lanthanide') {
    const lnOrder = [57,58,59,60,61,62,63,64,65,66,67,68,69,70,71];
    const idx = lnOrder.indexOf(Z);
    return [idx + 4, 9];
  }
  if (cat === 'actinide') {
    const acOrder = [89,90,91,92,93,94,95,96,97,98,99,100,101,102,103];
    const idx = acOrder.indexOf(Z);
    return [idx + 4, 10];
  }
}

function buildGrid() {
  const grid = document.getElementById('grid');
  // 18 cols, 10 rows
  const cells = {};
  Object.values(byZ).forEach(el => {
    const pos = getPos(el);
    if (pos) cells[`${pos[0]},${pos[1]}`] = el;
  });

  for (let row = 1; row <= 10; row++) {
    for (let col = 1; col <= 18; col++) {
      const key = `${col},${row}`;
      const el = cells[key];
      if (el) {
        const div = document.createElement('div');
        div.className = `cell ${el.cat}`;
        div.dataset.z = el.Z;
        div.innerHTML = `<span class="num">${el.Z}</span><span class="sym">${el.sym}</span><span class="name">${el.name}</span><span class="mass">${parseFloat(el.mass).toFixed(el.mass < 100 ? 2 : 1)}</span>`;
        div.addEventListener('click', () => openPanel(el.Z));
        grid.appendChild(div);
      } else if (row === 6 && col === 3) {
        // La series label
        const d = document.createElement('div');
        d.className = 'series-label lanthanide';
        d.innerHTML = '57–71<br>Ln';
        grid.appendChild(d);
      } else if (row === 7 && col === 3) {
        const d = document.createElement('div');
        d.className = 'series-label actinide';
        d.innerHTML = '89–103<br>Ac';
        grid.appendChild(d);
      } else if (row === 9 && col === 1) {
        const d = document.createElement('div');
        d.className = 'series-label lanthanide';
        d.innerHTML = 'Lanthanides';
        grid.appendChild(d);
      } else if (row === 10 && col === 1) {
        const d = document.createElement('div');
        d.className = 'series-label actinide';
        d.innerHTML = 'Actinides';
        grid.appendChild(d);
      } else if (row === 9 && col === 2) {
        const d = document.createElement('div');
        d.className = 'series-label';
        d.innerHTML = '';
        grid.appendChild(d);
      } else if (row === 10 && col === 2) {
        const d = document.createElement('div');
        d.className = 'series-label';
        d.innerHTML = '';
        grid.appendChild(d);
      } else {
        const d = document.createElement('div');
        d.className = 'placeholder';
        grid.appendChild(d);
      }
    }
  }
}

function buildLegend() {
  const leg = document.getElementById('legend');
  Object.entries(CATS).forEach(([key, val]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.style.cursor = 'pointer';
    item.dataset.cat = key;
    item.innerHTML = `<div class="legend-swatch ${key}"></div><span>${val.label}</span>`;
    item.addEventListener('click', () => filterCat(key, item));
    leg.appendChild(item);
  });
}

let activeFilter = null;
function filterCat(cat, btn) {
  if (activeFilter === cat) {
    activeFilter = null;
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('dimmed','highlighted'));
    document.querySelectorAll('.legend-item').forEach(i => i.style.fontWeight = '');
  } else {
    activeFilter = cat;
    document.querySelectorAll('.cell').forEach(c => {
      const el = byZ[c.dataset.z];
      if (!el) return;
      if (el.cat === cat) { c.classList.remove('dimmed'); c.classList.add('highlighted'); }
      else { c.classList.add('dimmed'); c.classList.remove('highlighted'); }
    });
    document.querySelectorAll('.legend-item').forEach(i => {
      i.style.fontWeight = (i.dataset.cat === cat) ? '700' : '';
    });
  }
}

let searchActive = false;
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) {
    searchActive = false;
    document.querySelectorAll('.cell').forEach(c => { c.classList.remove('dimmed','highlighted'); });
    return;
  }
  searchActive = true;
  activeFilter = null;
  document.querySelectorAll('.legend-item').forEach(i => i.style.fontWeight = '');
  document.querySelectorAll('.cell').forEach(c => {
    const el = byZ[c.dataset.z];
    if (!el) return;
    const match = el.name.toLowerCase().includes(q) || el.sym.toLowerCase().includes(q) || String(el.Z).includes(q);
    if (match) { c.classList.remove('dimmed'); c.classList.add('highlighted'); }
    else { c.classList.add('dimmed'); c.classList.remove('highlighted'); }
  });
});

function openPanel(z) {
  const el = byZ[z];
  const sym = document.getElementById('pd-sym');
  sym.className = `big-sym ${el.cat}`;
  sym.innerHTML = `<span class="s">${el.sym}</span><span class="n">${el.Z}</span>`;
  document.getElementById('pd-name').textContent = el.name;
  document.getElementById('pd-cat').textContent = CATS[el.cat]?.label || el.cat;
  document.getElementById('pd-z').textContent = `Atomic number: ${el.Z} · Atomic mass: ${el.mass} u`;

  document.getElementById('pd-basic').innerHTML = `
    <div class="info-card"><div class="label">Period</div><div class="value">${el.per}</div></div>
    <div class="info-card"><div class="label">Group</div><div class="value">${el.grp || '—'}</div></div>
    <div class="info-card"><div class="label">Atomic mass</div><div class="value">${el.mass} u</div></div>
    <div class="info-card"><div class="label">Category</div><div class="value" style="font-size:12px">${CATS[el.cat]?.label || el.cat}</div></div>
  `;

  document.getElementById('pd-econf').textContent = el.econf;

  const oxDiv = document.getElementById('pd-ox');
  oxDiv.innerHTML = el.ox.map(o => `<span class="chip ox">${o}</span>`).join('');
  document.getElementById('pd-ox-detail').textContent = el.oxNote;

  const valDiv = document.getElementById('pd-val');
  valDiv.innerHTML = el.val.map(v => `<span class="chip">${v}</span>`).join('');

  const isoDiv = document.getElementById('pd-iso');
  const hasStable = el.iso.some(i => i.includes('stable'));
  isoDiv.innerHTML = el.iso.map(i => {
    const stable = i.toLowerCase().includes('stable');
    return `<span class="chip isotope ${stable ? 'stable' : 'unstable'}">${i}</span>`;
  }).join('');

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePanel() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closePanel();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

buildGrid();
buildLegend();
</script>
</body>
</html>
